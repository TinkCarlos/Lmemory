[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lmemory"
version = "2.1.3"
description = "Your AI remembers what you decided, and what you changed your mind about: plain-Markdown memory for any MCP app."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Tink"}]
keywords = ["memory", "mcp", "agent-memory", "obsidian", "second-brain", "claude-code", "codex", "cursor"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/TinkCarlos/Lmemory/"
Source = "https://github.com/TinkCarlos/Lmemory"
Changelog = "https://github.com/TinkCarlos/Lmemory/blob/main/CHANGELOG.md"

[project.scripts]
lmemory = "lmemory.cli:main"

[project.optional-dependencies]
llamaindex = ["llama-index-core>=0.12"]
langgraph = ["langgraph>=1.0,<2"]   # lmemory.integrations.langgraph：LangGraph 的长期记忆存储（需要 Python 3.10+）

[tool.setuptools]
packages = ["lmemory", "lmemory.integrations", "lmemory_router", "lmemory_template", "lmemory_template_zh"]

[tool.setuptools.package-dir]
lmemory = "sdk/lmemory"
"lmemory.integrations" = "sdk/lmemory/integrations"
lmemory_router = "skill/lmemory/scripts"
lmemory_template = "template"
lmemory_template_zh = "template-zh"

[tool.setuptools.package-data]
lmemory = ["view_ui/*"]  # lmemory view: the page, hand-written, no external file
lmemory_router = ["*.sh", "*.txt", "*.psv"]
lmemory_template = ["**/*"]       # lmemory demo 用的示例库
lmemory_template_zh = ["**/*"]
